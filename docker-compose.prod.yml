# 🚀 ProVen Production Orchestration
version: '3.8'

services:
  backend:
    build: .
    container_name: proven-backend
    restart: always
    environment:
      - NODE_ENV=production
      - PORT=5000
      - DATABASE_URL=${DATABASE_URL}
      - JWT_SECRET=${JWT_SECRET}
    ports:
      - "5000:5000"
