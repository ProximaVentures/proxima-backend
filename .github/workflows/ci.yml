name: ProProven Backend CI/CD

on:
  push:
    branches: [ master, feat/* ]
  pull_request:
    branches: [ master ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    # NOTE: Database service can be added here for integration tests if needed.
    # services:
    #   postgres:
    #     image: postgres:15-alpine
    #     env:
    #       POSTGRES_PASSWORD: password

    steps:
      - name: 📥 Checkout Code
        uses: actions/checkout@v4

      - name: 🟢 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: 📦 Install Dependencies
        run: npm install

      - name: �️ Generate Prisma Client
        run: npx prisma generate

      - name: �💎 Validate Prisma Schema
        run: npx prisma validate

      - name: 🏗️ Run Type Check & Build
        run: npm run build

      - name: 🧪 Run Unit Tests
        run: npm test
        env:
          DATABASE_URL: postgres://dummy:dummy@localhost:5432/dummy
          JWT_SECRET: test_secret

      - name: 🐋 Verify Docker Build
        run: docker build -t proproven-backend:latest .

