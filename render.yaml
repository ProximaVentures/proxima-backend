services:
  - type: web
    name: proven-backend
    runtime: node
    plan: free # or your preferred plan
    region: frankfurt # update to your preferred region
    buildCommand: npm install && npx prisma generate && npx prisma migrate deploy && npm run build
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: proven-db # Replace this with your database name if using Render Postgres
          property: connectionString
        # Or if using Neon/External:
        # sync: false # manually set in dashboard or use - key: DATABASE_URL
      - key: JWT_SECRET
        generateValue: true
      - key: EMAIL_USER
        sync: false
      - key: EMAIL_PASS
        sync: false
      - key: EMAIL_FROM
        sync: false
      - key: PORT
        value: 5000
