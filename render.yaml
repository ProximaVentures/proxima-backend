services:
  - type: web
    name: proven-backend
    runtime: node
    plan: free # or your preferred plan
    region: frankfurt # update to your preferred region
    buildCommand: npm install && npx prisma generate && npx prisma migrate deploy && npm run build
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: proven-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: redis
          name: proven-redis
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: RESEND_API_KEY
        sync: false
      - key: EMAIL_FROM
        sync: false
      - key: ALLOWED_ORIGINS
        sync: false
      - key: PORT
        value: 5000

  - type: redis
    name: proven-redis
    plan: free # or your preferred plan
    region: frankfurt
    ipAllowList: [] # Allow all internal traffic
